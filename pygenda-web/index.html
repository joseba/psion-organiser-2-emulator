<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pygenda</title>
<meta name="description" content="Pygenda Web – a calendar/agenda inspired by the Psion Series 3/5 Agenda. Runs entirely in the browser (localStorage).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='5' width='24' height='23' rx='2' fill='%23fafafa' stroke='%23888'/%3E%3Crect x='4' y='5' width='24' height='6' rx='2' fill='%2373c140'/%3E%3Cpath d='M7 15h18M7 19h18M7 23h18M10 13v13M14 13v13M18 13v13M22 13v13' stroke='%23bbb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/pygenda.css">
</head>
<body>
<noscript>Pygenda Web needs JavaScript.</noscript>
<script src="js/util.js"></script>
<script src="js/rrule.js"></script>
<script src="js/ical.js"></script>
<script src="js/calendar.js"></script>
<script src="js/widgets.js"></script>
<script src="js/views.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/sample.js"></script>
<script src="js/gui.js"></script>
<script>
  /* Optional user CSS (like ~/.config/pygenda/pygenda.css) stored under pygenda.usercss */
  (function () {
    var css = PG.storage.get('pygenda.usercss');
    if (css) { var s = document.createElement('style'); s.textContent = css; document.head.appendChild(s); }
  })();
  PG.GUI.init();
</script>
</body>
</html>
